<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Lagos Hustle: Open World</title>
                <style>
                        body {
                                    margin: 0;
                                                padding: 0;
                                                            background: #111;
                                                                        color: #fff;
                                                                                    font-family: sans-serif;
                                                                                                overflow: hidden;
                                                                                                            user-select: none;
                                                                                                                    }
                                                                                                                            #gameCanvas {
                                                                                                                                        display: block;
                                                                                                                                                    background: #222; /* Dark asphalt street background */
                                                                                                                                                                margin: 0 auto;
                                                                                                                                                                        }
                                                                                                                                                                                #ui-overlay {
                                                                                                                                                                                            position: absolute;
                                                                                                                                                                                                        top: 10px;
                                                                                                                                                                                                                    left: 10px;
                                                                                                                                                                                                                                font-size: 18px;
                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                        text-shadow: 2px 2px #000;
                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                        /* Mobile controls overlay */
                                                                                                                                                                                                                                                                                .controls {
                                                                                                                                                                                                                                                                                            position: absolute;
                                                                                                                                                                                                                                                                                                        bottom: 20px;
                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                                                                                                                                            justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                        padding: 0 20px;
                                                                                                                                                                                                                                                                                                                                                                    box-sizing: border-box;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                    .d-pad, .action-buttons {
                                                                                                                                                                                                                                                                                                                                                                                                display: grid;
                                                                                                                                                                                                                                                                                                                                                                                                            gap: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                            .d-pad { grid-template-columns: repeat(3, 60px); }
                                                                                                                                                                                                                                                                                                                                                                                                                                    .action-buttons { grid-template-columns: repeat(2, 70px); }
                                                                                                                                                                                                                                                                                                                                                                                                                                            button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 60px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    height: 60px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: rgba(255, 255, 255, 0.3);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border: 2px solid #fff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button:active { background: rgba(255, 255, 255, 0.6); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .btn-action { width: 70px; height: 70px; border-radius: 10px; background: rgba(255, 200, 0, 0.5); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="ui-overlay">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div>Naira: ₦<span id="cash">500</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>Wanted Level: <span id="wanted">⭐☆☆☆☆</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>Current Location: <span id="zone">Eko Bridge</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <canvas id="gameCanvas"></canvas>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Mobile Screen Touch Controls -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="d-pad">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="btn-up">▲</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="btn-left">◀</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="btn-right">▶</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="btn-down">▼</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="action-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="btn-action" id="btn-hustle">HUSTLE</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn-action" id="btn-enter" style="background: rgba(255,0,0,0.5)">ENTER</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const canvas = document.getElementById("gameCanvas");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const ctx = canvas.getContext("2d");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Make canvas fit the mobile screen
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            canvas.width = window.innerWidth;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                canvas.height = window.innerHeight;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Player Properties (Starting as a yellow Danfo bus or walking sprite)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let player = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                x: canvas.width / 2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        y: canvas.height / 2,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                size: 30,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        speed: 4,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                color: "#FFCC00" // Classic Lagos Yellow Danfo color
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Control States
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Draw the game objects
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function draw() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.clearRect(0, 0, canvas.width, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Draw a simple road grid line to simulate moving in Lagos streets
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.strokeStyle = "#444";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.lineWidth = 4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for (let i = 0; i < canvas.width; i += 100) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        for (let j = 0; j < canvas.height; j += 100) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Draw Player (The Danfo Bus)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = player.color;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size * 1.5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Draw black stripes on the Lagos Danfo bus
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillStyle = "#000";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(player.x - player.size/2, player.y - player.size/6, player.size, 5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillRect(player.x - player.size/2, player.y + player.size/4, player.size, 5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Update positions game loop
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function update() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (moveUp && player.y > 0) player.y -= player.speed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (moveDown && player.y < canvas.height) player.y += player.speed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (moveLeft && player.x > 0) player.x -= player.speed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (moveRight && player.x < canvas.width) player.x += player.speed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function gameLoop() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        update();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                draw();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        requestAnimationFrame(gameLoop);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Setup touch events for Android screen layout buttons
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function setupTouchBtn(id, pressCallback, releaseCallback) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const btn = document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    btn.addEventListener("touchstart", (e) => { e.preventDefault(); pressCallback(); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            btn.addEventListener("touchend", (e) => { e.preventDefault(); releaseCallback(); });
